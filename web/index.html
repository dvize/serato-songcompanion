<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serato Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ── Collapsed pill (visible when window is small) ── -->
    <div id="pill">
        <div class="pill-drag-area">
            <span class="pill-icon">♫</span>
            <div class="pill-track">
                <span id="pillTitle">Serato Companion</span>
                <span id="pillArtist"></span>
            </div>
        </div>
        <div class="pill-meta">
            <span class="pill-chip" id="pillBPM"></span>
            <span class="pill-chip" id="pillKey"></span>
        </div>
    </div>

    <!-- ── Expanded full app ── -->
    <div class="app-container" id="appContainer">
        <header class="glass-panel app-drag-area">
            <div class="logo">
                <span class="icon">🎵</span>
                <h1>Serato Companion</h1>
            </div>
            <div class="header-right">
                <div class="session-stats" id="sessionStats" title="Tracks played tonight"></div>
                <div class="zoom-control" title="UI Scale">
                    <span class="zoom-label">⊖</span>
                    <input type="range" id="zoomSlider" class="zoom-slider" min="50" max="150" step="5" value="100">
                    <span class="zoom-label">⊕</span>
                    <span class="zoom-value" id="zoomValue">100%</span>
                </div>
                <div class="status-indicator" id="connectionStatus">
                    <span class="dot"></span>
                    <span class="text">Connected</span>
                </div>
                <button type="button" id="settingsBtn" class="settings-btn" title="Settings">&#9881;</button>
            </div>
        </header>

        <main>
            <!-- Current Track Section -->
            <section class="current-track-section glass-panel">
                <div class="section-header">
                    <h2>Now Playing</h2>
                    <div style="display:flex;align-items:center;gap:10px;">
                        <button type="button" id="lockBtn" class="lock-btn" title="Lock track — ignore previews">&#128274; Lock</button>
                        <div class="live-badge" id="liveBadge">LIVE</div>
                    </div>
                </div>
                <div class="track-card active" id="currentTrackCard">
                    <div class="track-info">
                        <h3 id="currentTitle">Waiting for track...</h3>
                        <p id="currentArtist">Start playing in Serato</p>
                    </div>
                    <div class="track-meta">
                        <div class="meta-item">
                            <span class="label">BPM</span>
                            <span class="value" id="currentBPM">--</span>
                        </div>
                        <div class="meta-item">
                            <span class="label">KEY</span>
                            <span class="value" id="currentKey">--</span>
                        </div>
                        <div class="meta-item">
                            <span class="label">ENERGY</span>
                            <span class="value" id="currentEnergy">--</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Recommendations Section -->
            <section class="recommendations-section" id="recommendationsSection">
                <div class="section-header">
                    <h2>Recommendations</h2>
                    <button type="button" id="toggleFiltersBtn" class="toggle-filters-btn" title="Show/hide filters">Filters ▲</button>
                </div>

                <!-- Filters Panel -->
                <div class="filters-panel glass-panel">
                    <!-- Toggle row -->
                    <div class="filter-row">
                        <label class="toggle">
                            <input type="checkbox" id="filterKey" checked>
                            <span class="slider"></span>
                            <span class="label-text">Harmonic Key</span>
                        </label>
                        <label class="toggle">
                            <input type="checkbox" id="filterGenre">
                            <span class="slider"></span>
                            <span class="label-text">Same Genre</span>
                        </label>
                        <div class="filter-group">
                            <label class="filter-label">Energy</label>
                            <select id="filterEnergyMode" class="filter-select">
                                <option value="any">Any</option>
                                <option value="exact">Exact</option>
                                <option value="within" selected>Match ±1</option>
                                <option value="higher">Higher</option>
                                <option value="lower">Lower</option>
                            </select>
                        </div>
                        <div class="filter-group" id="energyRangeGroup" style="display:none;">
                            <label class="filter-label">Range</label>
                            <select id="filterEnergyRange" class="filter-select">
                                <option value="1" selected>±1</option>
                                <option value="2">±2</option>
                                <option value="3">±3</option>
                                <option value="4">±4</option>
                            </select>
                        </div>
                        <label class="toggle">
                            <input type="checkbox" id="filterHidePlayed">
                            <span class="slider"></span>
                            <span class="label-text">Hide Played</span>
                        </label>
                    </div>

                    <!-- BPM range row -->
                    <div class="filter-row filter-row-inputs">
                        <div class="filter-group">
                            <label class="filter-label">BPM Min</label>
                            <input type="number" id="filterBpmMin" class="filter-input" placeholder="e.g. 120" min="0" max="300">
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">BPM Max</label>
                            <input type="number" id="filterBpmMax" class="filter-input" placeholder="e.g. 132" min="0" max="300">
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">Max Results</label>
                            <select id="filterMaxResults" class="filter-select">
                                <option value="10">10</option>
                                <option value="25">25</option>
                                <option value="50" selected>50</option>
                                <option value="100">100</option>
                                <option value="0">All</option>
                            </select>
                        </div>
                    </div>

                    <!-- Year added row -->
                    <div class="filter-row filter-row-inputs">
                        <div class="filter-group">
                            <label class="filter-label">From Year</label>
                            <input type="number" id="filterYearMin" class="filter-input" placeholder="e.g. 2024" min="1900" max="2099">
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">To Year</label>
                            <input type="number" id="filterYearMax" class="filter-input" placeholder="e.g. 2026" min="1900" max="2099">
                        </div>
                        <div class="filter-group year-source-group">
                            <label class="filter-label">Year Type</label>
                            <div class="year-source-toggle">
                                <button type="button" class="year-source-btn active" data-source="added">Date Added</button>
                                <button type="button" class="year-source-btn" data-source="year">Song Year</button>
                            </div>
                        </div>
                        <div class="filter-group" style="justify-content:flex-end;align-items:flex-end;">
                            <button type="button" id="filterYearAll" class="year-all-btn">All Years</button>
                        </div>
                    </div>
                </div>

                <div class="recommendations-list" id="recommendationsList">
                    <div class="empty-state">
                        <p>Play a track to see recommendations</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- ── Settings slide-over ── -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel glass-panel">
            <div class="settings-header">
                <h2>Settings</h2>
                <button type="button" id="settingsCloseBtn" class="settings-close" title="Close">&#10005;</button>
            </div>
            <div class="settings-body">

                <h3 class="settings-section-title">Matching</h3>
                <div class="settings-row">
                    <label class="settings-label">Default Energy</label>
                    <div class="settings-inline">
                        <select id="setEnergyMode" class="filter-select">
                            <option value="any">Any</option>
                            <option value="exact">Exact</option>
                            <option value="within">Within ±N</option>
                            <option value="higher">Higher</option>
                            <option value="lower">Lower</option>
                        </select>
                        <select id="setEnergyRange" class="filter-select" style="display:none;">
                            <option value="1">±1</option>
                            <option value="2">±2</option>
                            <option value="3">±3</option>
                            <option value="4">±4</option>
                            <option value="5">±5</option>
                        </select>
                    </div>
                </div>
                <div class="settings-row">
                    <label class="settings-label">Genres to Match</label>
                    <div class="settings-inline">
                        <select id="setGenreMode" class="filter-select">
                            <option value="any">Any of</option>
                            <option value="all">All of</option>
                        </select>
                        <select id="setGenreCount" class="filter-select">
                            <option value="0" selected>All genres</option>
                            <option value="1">First 1</option>
                            <option value="2">First 2</option>
                            <option value="3">First 3</option>
                            <option value="4">First 4</option>
                            <option value="5">First 5</option>
                        </select>
                    </div>
                </div>
                <div class="settings-row">
                    <label class="settings-label">BPM Tolerance %</label>
                    <div class="settings-inline">
                        <input type="number" id="setBpmPercent" class="filter-input" min="1" max="50" step="1">
                        <label class="toggle">
                            <input type="checkbox" id="setBpmHalfDouble">
                            <span class="slider"></span>
                            <span class="label-text">Half/Double</span>
                        </label>
                    </div>
                </div>
                <div class="settings-row settings-stack">
                    <label class="settings-label">Key Compatibility Tiers</label>
                    <div class="key-tiers" id="setKeyTiers">
                        <label class="toggle"><input type="checkbox" data-tier="same"><span class="slider"></span><span class="label-text">Same</span></label>
                        <label class="toggle"><input type="checkbox" data-tier="relative"><span class="slider"></span><span class="label-text">Relative</span></label>
                        <label class="toggle"><input type="checkbox" data-tier="adjacent"><span class="slider"></span><span class="label-text">Adjacent</span></label>
                        <label class="toggle"><input type="checkbox" data-tier="energy_boost"><span class="slider"></span><span class="label-text">Energy Boost</span></label>
                        <label class="toggle"><input type="checkbox" data-tier="dominant"><span class="slider"></span><span class="label-text">Dominant</span></label>
                    </div>
                </div>
                <div class="settings-row">
                    <label class="settings-label">Max Results</label>
                    <select id="setMaxResults" class="filter-select">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="0">All</option>
                    </select>
                </div>
                <div class="settings-row">
                    <label class="settings-label">Hide Played by Default</label>
                    <label class="toggle"><input type="checkbox" id="setHidePlayed"><span class="slider"></span></label>
                </div>
                <div class="settings-row">
                    <label class="settings-label">Replay Cooldown (min)</label>
                    <select id="setCooldownMin" class="filter-select">
                        <option value="0" selected>Off</option>
                        <option value="5">5</option>
                        <option value="10">10</option>
                        <option value="15">15</option>
                        <option value="30">30</option>
                        <option value="60">60</option>
                    </select>
                </div>

                <h3 class="settings-section-title">Window</h3>
                <div class="settings-row">
                    <label class="settings-label">Collapsed Size</label>
                    <div class="settings-inline">
                        <input type="number" id="setCollapsedW" class="filter-input" min="200" max="800" step="10" placeholder="w">
                        <input type="number" id="setCollapsedH" class="filter-input" min="32" max="300" step="4" placeholder="h">
                    </div>
                </div>
                <div class="settings-row">
                    <label class="settings-label">Expanded Size</label>
                    <div class="settings-inline">
                        <input type="number" id="setExpandedW" class="filter-input" min="400" max="2000" step="20" placeholder="w">
                        <input type="number" id="setExpandedH" class="filter-input" min="300" max="1600" step="20" placeholder="h">
                    </div>
                </div>
                <div class="settings-row">
                    <label class="settings-label">Idle Dim</label>
                    <div class="settings-inline">
                        <label class="toggle"><input type="checkbox" id="setDimEnabled"><span class="slider"></span></label>
                        <input type="number" id="setDimDelay" class="filter-input" min="1" max="120" step="1" title="Delay seconds" placeholder="sec">
                        <input type="number" id="setDimOpacity" class="filter-input" min="5" max="100" step="5" title="Opacity %" placeholder="%">
                    </div>
                </div>
                <div class="settings-row">
                    <label class="settings-label">Expand Hotkey</label>
                    <input type="text" id="setHotkey" class="filter-input hotkey-input" placeholder="Click, then press combo" title="Focus this field and press the key combination you want. Escape/Backspace clears. Or type an Electron accelerator, e.g. CommandOrControl+Shift+Space">
                </div>
                <div class="settings-row">
                    <label class="settings-label">Tray Icon (mac)</label>
                    <label class="toggle"><input type="checkbox" id="setTrayMode"><span class="slider"></span></label>
                </div>

                <h3 class="settings-section-title">General</h3>
                <div class="settings-row">
                    <label class="settings-label">Session Stats</label>
                    <label class="toggle"><input type="checkbox" id="setSessionStats"><span class="slider"></span></label>
                </div>
            </div>
            <div class="settings-footer">
                <span class="settings-saved" id="settingsSaved"></span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
